databases:
  - name: vachana-kranti-db
    databaseName: vachanakranti
    user: vachanakranti_user
    plan: free

services:
  - type: web
    name: vachana-kranti
    runtime: node
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vachana-kranti-db
          property: connectionString
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
